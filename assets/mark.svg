<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unhinged">
  <defs>
    <linearGradient id="m-heart" x1="30" y1="24" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6B8A"/><stop offset="1" stop-color="#FF3D6E"/>
    </linearGradient>
  </defs>
  <!-- hinge -->
  <line x1="30" y1="30" x2="30" y2="86" stroke="#C9C2C6" stroke-width="4" stroke-linecap="round"/>
  <rect x="22" y="30" width="16" height="22" rx="6" fill="#E7E1E4" stroke="#C9C2C6" stroke-width="2.5"/>
  <rect x="22" y="66" width="16" height="22" rx="6" fill="#E7E1E4" stroke="#C9C2C6" stroke-width="2.5"/>
  <circle cx="30" cy="58" r="4.5" fill="#B8B0B4"/>
  <!-- crooked heart -->
  <g transform="rotate(13 68 66)">
    <path d="M68 96 C68 96 34 72 34 50 C34 40 42 33 51 33 C59 33 65 39 68 45
             C71 39 77 33 85 33 C94 33 102 40 102 50 C102 72 68 96 68 96 Z"
          fill="url(#m-heart)"/>
  </g>
  <!-- popped screw -->
  <g transform="translate(92 30)">
    <circle r="7" fill="#FFD15C" stroke="#E8B94A" stroke-width="1.8"/>
    <line x1="-3.5" y1="0" x2="3.5" y2="0" stroke="#B9922E" stroke-width="2" stroke-linecap="round" transform="rotate(35)"/>
  </g>
</svg>
