name: deploy

# Publishes the static site to GitHub Pages (served at unhinged.love via CNAME).
# No build step — the app is plain HTML/CSS/ES-modules, so we just upload the
# repo root as the Pages artifact.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Browser smoke test — gates the deploy. Catches app-breaking regressions
  # (e.g. an overlay that eats all clicks) that syntax checks can't.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright (chromium)
        working-directory: test
        run: npm install && npx playwright install --with-deps chromium
      - name: Serve site and run smoke test
        run: |
          python3 -m http.server 8000 &
          SERVER=$!
          sleep 2
          BASE=http://localhost:8000 node test/smoke.mjs
          kill $SERVER

  deploy:
    needs: smoke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
