name: deploy

# Publishes the static site to GitHub Pages (served at unhinged.love via CNAME).
# No build step — the app is plain HTML/CSS/ES-modules, so we just upload the
# repo root as the Pages artifact.

on:
  push:
    branches: [main]
  # PRs run the smoke test + Pages artifact build, but never deploy.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Browser smoke test — gates the deploy. Catches app-breaking regressions
  # (e.g. an overlay that eats all clicks) that syntax checks can't.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install Playwright (chromium)
        working-directory: test
        run: npm install && npx playwright install --with-deps chromium
      - name: Serve site and run smoke test
        run: |
          python3 -m http.server 8000 &
          SERVER=$!
          sleep 2
          BASE=http://localhost:8000 node test/smoke.mjs
          kill $SERVER

  # Builds the Pages artifact. Runs on PRs too, to prove the artifact step works.
  build:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
