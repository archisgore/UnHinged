name: warm-faces

# The growing corpus: every few hours, bank the next chunk of photorealistic
# faces onto the volume so there's always fresh, ready content — accumulating
# over time toward effectively infinite. Token-gated (repo secret).

on:
  schedule:
    - cron: "0 9 * * *" # nightly (~02:00 PT / 09:00 UTC)
  workflow_dispatch:
    inputs:
      chunk:
        description: "How many faces to bank this run"
        default: "60"

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Bank the next chunk of faces
        run: |
          CHUNK="${{ github.event.inputs.chunk || '60' }}"
          echo "Nightly: bank $CHUNK new faces + expire oldest beyond the 1000 cap…"
          curl -sS -X POST "https://api.unhinged.love/api/admin/warm?chunk=$CHUNK" \
            -H "x-admin-token: ${{ secrets.UNHINGED_ADMIN_TOKEN }}" \
            --max-time 60
          echo
          echo "Corpus window (rolls forward nightly; runs in the background):"
          curl -sS "https://api.unhinged.love/api/corpus"
          echo
          echo "Nightly: grow the text banks (rolling window, capped at 1000 each)…"
          curl -sS -X POST "https://api.unhinged.love/api/admin/gentext?n=20" \
            -H "x-admin-token: ${{ secrets.UNHINGED_ADMIN_TOKEN }}" --max-time 60
          echo
          curl -sS "https://api.unhinged.love/api/text-stats"
