<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Unhinged Feed</title>
  <meta name="description" content="An infinite scroll of 100% fake dispatches — FML confessions and Onion-style headlines from a dating app where no one is real." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="https://unhinged.love/feed.html" />
  <meta property="og:title" content="The Unhinged Feed" />
  <meta property="og:description" content="An infinite scroll of 100% fake dispatches — FML confessions and Onion-style headlines." />
  <meta property="og:image" content="https://unhinged.love/assets/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://unhinged.love/assets/og.png" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/analytics.js"></script>
</head>
<body>
  <header class="feed-top">
    <a class="feed-back" href="index.html">← swipe</a>
    <div class="brand"><img src="assets/mark.svg" alt="" width="26" height="26" /><span class="wordmark">the feed</span></div>
    <span class="cert">✦ 100% fake</span>
  </header>

  <main class="feed" id="feed">
    <p class="feed-intro">Dispatches from a dating app where no one is real. Inspired by FML and The Onion — and, like them and everything here, entirely made up.</p>
  </main>

  <div class="feed-more-wrap" id="feed-more-wrap" hidden>
    <button class="btn btn-ghost" id="feed-more"></button>
  </div>

  <script type="module">
    import { makeFeedItem, fmlFromText, FINITE_ENDINGS } from "./js/feed.js";

    const feed = document.getElementById("feed");
    const moreWrap = document.getElementById("feed-more-wrap");
    const moreBtn = document.getElementById("feed-more");
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    const local = ["localhost", "127.0.0.1"].includes(location.hostname);
    const API = local ? "http://localhost:8000/api" : "https://api.unhinged.love/api";

    let seed = Math.floor(Math.random() * 100000);
    let lastText = "";
    let genFeed = [];        // fresh LLM-generated FML lines from the backend
    let indulged = 0;        // how many times the user asked for "more"
    const MAX_INDULGE = 2;

    function card(item) {
      const el = document.createElement("article");
      el.className = "feed-card feed-" + item.type;
      if (item.type === "fml") {
        el.innerHTML = `
          <p class="feed-text">${esc(item.text)}</p>
          <div class="feed-meta">
            <span>👍 ${item.agree.toLocaleString()} · ${esc(item.verdictA)}</span>
            <span>💀 ${item.deserved.toLocaleString()} · ${esc(item.verdictB)}</span>
          </div>`;
      } else {
        el.innerHTML = `
          <span class="feed-tag">${esc(item.tag)}</span>
          <h2 class="feed-head">${esc(item.text)}</h2>
          <div class="feed-meta"><span>↗ ${item.shares.toLocaleString()} shares into the void</span></div>`;
      }
      return el;
    }

    // One feed item: prefer a fresh LLM-generated line, else combinatorial.
    function nextItem() {
      if (genFeed.length && Math.random() < 0.55) {
        return fmlFromText(genFeed[Math.floor(Math.random() * genFeed.length)], seed++);
      }
      return makeFeedItem(seed++);
    }

    function append(n) {
      let added = 0;
      while (added < n) {
        const item = nextItem();
        if (item.text === lastText) continue; // no back-to-back repeats
        feed.appendChild(card(item));
        lastText = item.text;
        added++;
      }
    }

    function showEnding() {
      const msg = FINITE_ENDINGS[Math.floor(Math.random() * FINITE_ENDINGS.length)];
      const end = document.createElement("section");
      end.className = "feed-end";
      end.innerHTML = `
        <div class="feed-end-mark">🌅</div>
        <div class="feed-end-kicker">Finite Scroll™</div>
        <p class="feed-end-text">${esc(msg)}</p>
        <a class="btn btn-primary" href="index.html">Okay, I'm going ↗</a>`;
      feed.appendChild(end);
      if (indulged < MAX_INDULGE) {
        moreBtn.textContent = indulged === 0 ? "fine, 5 more (you don't need them)" : "5 more, then that's genuinely it";
        moreWrap.hidden = false;
      } else {
        moreWrap.hidden = true;
      }
    }

    moreBtn.addEventListener("click", () => {
      indulged++;
      moreWrap.hidden = true;
      feed.querySelector(".feed-end")?.remove();
      append(5);
      showEnding();
    });

    // Load a FINITE run (fresh generated + combinatorial), then end. No infinite scroll.
    fetch(`${API}/copy`).then((r) => r.ok ? r.json() : null).then((c) => {
      if (c && Array.isArray(c.feed)) genFeed = c.feed;
    }).catch(() => {}).finally(() => {
      append(14);
      showEnding();
    });
  </script>
</body>
</html>
